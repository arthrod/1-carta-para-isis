<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#FFF8F0"/>
  <ellipse cx="200" cy="375" rx="160" ry="10" fill="#E8DDD0" opacity="0.6"/>

  <!-- Soft warm glow in middle -->
  <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFF4D6" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#FFF8F0" stop-opacity="0"/>
  </radialGradient>
  <circle cx="200" cy="220" r="80" fill="url(#warmGlow)"/>

  <!-- Tiny sparkles of reconciliation -->
  <g fill="#FFCC00" stroke="#C99A00" stroke-width="1" opacity="0.8">
    <path d="M 200 150 L 202 154 L 206 154 L 203 157 L 204 161 L 200 158 L 196 161 L 197 157 L 194 154 L 198 154 Z"/>
    <circle cx="160" cy="175" r="2" fill="#FFCC00"/>
    <circle cx="240" cy="180" r="2" fill="#FFCC00"/>
    <circle cx="175" cy="260" r="1.5" fill="#FFCC00"/>
    <circle cx="225" cy="265" r="1.5" fill="#FFCC00"/>
  </g>

  <!-- ===== GIRL (left) - facing forward, holding bunny out ===== -->
  <g>
    <!-- Legs/feet -->
    <ellipse cx="85" cy="370" rx="14" ry="8" fill="#5B3A1F" stroke="#3D2817" stroke-width="2"/>
    <ellipse cx="115" cy="370" rx="14" ry="8" fill="#5B3A1F" stroke="#3D2817" stroke-width="2"/>
    <rect x="78" y="345" width="14" height="22" fill="#D4A373" stroke="#C76B9C" stroke-width="2"/>
    <rect x="108" y="345" width="14" height="22" fill="#D4A373" stroke="#C76B9C" stroke-width="2"/>

    <!-- Body (dress) -->
    <path d="M 65 285 Q 55 340 65 360 L 135 360 Q 145 340 135 285 Z" fill="#F4A6CD" stroke="#C76B9C" stroke-width="2.5"/>
    <path d="M 65 358 Q 75 365 85 358 Q 95 365 105 358 Q 115 365 125 358 Q 135 365 135 360" fill="none" stroke="#C76B9C" stroke-width="2"/>
    <!-- Collar / front detail -->
    <path d="M 80 290 Q 100 298 120 290" fill="none" stroke="#C76B9C" stroke-width="2.5"/>
    <circle cx="100" cy="295" r="3" fill="#E63946" stroke="#A02029" stroke-width="1"/>

    <!-- Left arm hanging shy -->
    <ellipse cx="58" cy="310" rx="11" ry="22" fill="#D4A373" stroke="#C76B9C" stroke-width="2.5" transform="rotate(-10 58 310)"/>
    <circle cx="50" cy="335" r="10" fill="#D4A373" stroke="#C76B9C" stroke-width="2.5"/>

    <!-- Right arm extended forward holding bunny -->
    <path d="M 125 295 Q 165 260 195 240" fill="none" stroke="#D4A373" stroke-width="20" stroke-linecap="round"/>
    <path d="M 125 295 Q 165 260 195 240" fill="none" stroke="#C76B9C" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hand offering -->
    <circle cx="198" cy="237" r="13" fill="#D4A373" stroke="#C76B9C" stroke-width="2.5"/>

    <!-- Head facing forward, slightly tilted right -->
    <g transform="rotate(5 100 200)">
      <!-- Hair back -->
      <path d="M 45 215 Q 45 152 100 148 Q 155 152 155 215 Q 155 235 147 245 L 53 245 Q 45 235 45 215 Z" fill="#6B4226"/>
      <!-- Face -->
      <circle cx="100" cy="205" r="55" fill="#D4A373" stroke="#7A4A1F" stroke-width="2.5"/>
      <!-- Bangs -->
      <path d="M 50 183 Q 70 163 100 163 Q 130 163 150 183 Q 140 192 127 188 Q 113 184 100 188 Q 87 184 73 188 Q 60 192 50 183 Z" fill="#6B4226"/>
      <!-- Both pigtails visible -->
      <g transform="translate(33 195) rotate(-15)">
        <ellipse cx="0" cy="15" rx="13" ry="22" fill="#6B4226" stroke="#4A2D1A" stroke-width="1.5"/>
        <ellipse cx="0" cy="-5" rx="9" ry="5" fill="#E63946" stroke="#A02029" stroke-width="1.5"/>
      </g>
      <g transform="translate(167 195) rotate(15)">
        <ellipse cx="0" cy="15" rx="13" ry="22" fill="#6B4226" stroke="#4A2D1A" stroke-width="1.5"/>
        <ellipse cx="0" cy="-5" rx="9" ry="5" fill="#E63946" stroke="#A02029" stroke-width="1.5"/>
      </g>

      <!-- Shy/sorry face -->
      <!-- Slightly raised pleading eyebrows -->
      <path d="M 68 183 Q 78 178 88 184" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
      <path d="M 112 184 Q 122 178 132 183" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
      <!-- Big shy eyes looking down/forward -->
      <ellipse cx="80" cy="212" rx="8" ry="9" fill="white" stroke="#3D2817" stroke-width="2"/>
      <ellipse cx="120" cy="212" rx="8" ry="9" fill="white" stroke="#3D2817" stroke-width="2"/>
      <circle cx="80" cy="216" r="4" fill="#3D2817"/>
      <circle cx="120" cy="216" r="4" fill="#3D2817"/>
      <circle cx="82" cy="214" r="1.3" fill="white"/>
      <circle cx="122" cy="214" r="1.3" fill="white"/>
      <!-- Soft blush -->
      <ellipse cx="63" cy="230" rx="10" ry="6" fill="#FFB3B3" opacity="0.7"/>
      <ellipse cx="137" cy="230" rx="10" ry="6" fill="#FFB3B3" opacity="0.7"/>
      <!-- Small uncertain smile -->
      <path d="M 88 243 Q 100 248 112 243" fill="none" stroke="#3D2817" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Speech bubble: "desculpa..." -->
    <g transform="translate(40 145)">
      <ellipse cx="0" cy="0" rx="32" ry="16" fill="white" stroke="#1C1815" stroke-width="2"/>
      <path d="M 18 12 L 30 22 L 22 12 Z" fill="white" stroke="#1C1815" stroke-width="2"/>
      <text x="0" y="4" font-family="Comic Sans MS, cursive" font-size="12" font-weight="bold" fill="#C76B9C" text-anchor="middle">desculpa...</text>
    </g>
  </g>

  <!-- ===== STUFFED BUNNY (being offered, happier now) ===== -->
  <g>
    <!-- Body -->
    <ellipse cx="215" cy="240" rx="22" ry="18" fill="#F5E6D3" stroke="#8B6F47" stroke-width="2.5"/>
    <!-- Head -->
    <circle cx="215" cy="218" r="18" fill="#F5E6D3" stroke="#8B6F47" stroke-width="2.5"/>
    <!-- Ears -->
    <ellipse cx="207" cy="198" rx="5" ry="15" fill="#F5E6D3" stroke="#8B6F47" stroke-width="2"/>
    <ellipse cx="223" cy="198" rx="5" ry="15" fill="#F5E6D3" stroke="#8B6F47" stroke-width="2"/>
    <ellipse cx="207" cy="200" rx="2.5" ry="10" fill="#FFB6C1"/>
    <ellipse cx="223" cy="200" rx="2.5" ry="10" fill="#FFB6C1"/>
    <!-- Happy bunny face -->
    <path d="M 209 215 Q 212 218 215 215" fill="none" stroke="#3D2817" stroke-width="2" stroke-linecap="round"/>
    <path d="M 215 215 Q 218 218 221 215" fill="none" stroke="#3D2817" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 210 224 Q 215 228 220 224" fill="none" stroke="#3D2817" stroke-width="2" stroke-linecap="round"/>
    <!-- Pink nose -->
    <path d="M 215 220 L 212 223 L 218 223 Z" fill="#FF9BB5"/>
    <!-- Tiny arm waving -->
    <ellipse cx="198" cy="240" rx="4" ry="7" fill="#F5E6D3" stroke="#8B6F47" stroke-width="1.5" transform="rotate(-20 198 240)"/>
  </g>

  <!-- ===== BABY BOY (right) - reaching out tentatively ===== -->
  <g>
    <!-- Legs spread out (sitting) -->
    <ellipse cx="290" cy="370" rx="16" ry="8" fill="#7EC8E3" stroke="#3A6FA8" stroke-width="2"/>
    <ellipse cx="335" cy="370" rx="16" ry="8" fill="#7EC8E3" stroke="#3A6FA8" stroke-width="2"/>
    <path d="M 285 345 L 290 370 L 300 370 L 295 345 Z" fill="#D4A373" stroke="#3A6FA8" stroke-width="2"/>
    <path d="M 325 345 L 330 370 L 340 370 L 335 345 Z" fill="#D4A373" stroke="#3A6FA8" stroke-width="2"/>

    <!-- Body (onesie, sitting) -->
    <path d="M 275 300 Q 268 345 280 360 L 340 360 Q 350 345 343 300 Z" fill="#7EC8E3" stroke="#3A6FA8" stroke-width="2.5"/>
    <circle cx="312" cy="320" r="3" fill="#3A6FA8"/>
    <circle cx="312" cy="340" r="3" fill="#3A6FA8"/>

    <!-- Right arm reaching out toward bunny -->
    <path d="M 280 305 Q 250 270 230 245" fill="none" stroke="#D4A373" stroke-width="18" stroke-linecap="round"/>
    <path d="M 280 305 Q 250 270 230 245" fill="none" stroke="#3A6FA8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hand reaching -->
    <circle cx="228" cy="243" r="12" fill="#D4A373" stroke="#3A6FA8" stroke-width="2.5"/>

    <!-- Left arm relaxed -->
    <ellipse cx="350" cy="315" rx="11" ry="20" fill="#D4A373" stroke="#3A6FA8" stroke-width="2.5" transform="rotate(15 350 315)"/>
    <circle cx="360" cy="335" r="10" fill="#D4A373" stroke="#3A6FA8" stroke-width="2.5"/>

    <!-- Head -->
    <circle cx="305" cy="215" r="58" fill="#D4A373" stroke="#7A4A1F" stroke-width="2.5"/>

    <!-- Baby hair -->
    <path d="M 295 162 Q 300 150 305 160 Q 308 153 312 162" fill="none" stroke="#6B4226" stroke-width="3" stroke-linecap="round"/>
    <path d="M 290 168 Q 297 158 302 168" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 310 170 Q 317 160 322 170" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Curious/hopeful face -->
    <!-- Raised eyebrows -->
    <path d="M 278 195 Q 288 190 295 196" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
    <path d="M 315 196 Q 322 190 332 195" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
    <!-- Big hopeful eyes -->
    <ellipse cx="288" cy="215" rx="9" ry="10" fill="white" stroke="#3D2817" stroke-width="2"/>
    <ellipse cx="322" cy="215" rx="9" ry="10" fill="white" stroke="#3D2817" stroke-width="2"/>
    <circle cx="285" cy="218" r="5" fill="#3D2817"/>
    <circle cx="319" cy="218" r="5" fill="#3D2817"/>
    <circle cx="287" cy="215" r="1.5" fill="white"/>
    <circle cx="321" cy="215" r="1.5" fill="white"/>
    <!-- Soft pink cheeks -->
    <ellipse cx="271" cy="232" rx="10" ry="6" fill="#FFB3B3" opacity="0.7"/>
    <ellipse cx="339" cy="232" rx="10" ry="6" fill="#FFB3B3" opacity="0.7"/>
    <!-- Small open mouth (the gap and one tooth visible) - slight smile -->
    <path d="M 297 248 Q 305 252 313 248 Q 308 246 305 246 Q 302 246 297 248 Z" fill="#8B2C2C" stroke="#3D2817" stroke-width="1.5"/>
    <rect x="307" y="246" width="3" height="3" fill="white"/>
  </g>

  <!-- Number badge -->
  <circle cx="370" cy="30" r="22" fill="#1C1815"/>
  <text x="370" y="38" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFCC00" text-anchor="middle">7</text>
</svg>
