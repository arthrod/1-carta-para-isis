<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#FFF8F0"/>
  <ellipse cx="200" cy="375" rx="170" ry="10" fill="#E8DDD0" opacity="0.6"/>

  <!-- Soft flowers/petals floating around -->
  <g>
    <g transform="translate(60 100)">
      <circle cx="0" cy="0" r="4" fill="#FFCC00"/>
      <circle cx="-6" cy="-3" r="3.5" fill="#F4A6CD"/>
      <circle cx="6" cy="-3" r="3.5" fill="#F4A6CD"/>
      <circle cx="-4" cy="4" r="3.5" fill="#F4A6CD"/>
      <circle cx="4" cy="4" r="3.5" fill="#F4A6CD"/>
    </g>
    <g transform="translate(340 110)">
      <circle cx="0" cy="0" r="4" fill="#FFCC00"/>
      <circle cx="-6" cy="-3" r="3.5" fill="#7EC8E3"/>
      <circle cx="6" cy="-3" r="3.5" fill="#7EC8E3"/>
      <circle cx="-4" cy="4" r="3.5" fill="#7EC8E3"/>
      <circle cx="4" cy="4" r="3.5" fill="#7EC8E3"/>
    </g>
    <g transform="translate(40 220)">
      <circle cx="0" cy="0" r="3" fill="#FFCC00"/>
      <circle cx="-5" cy="-2" r="2.5" fill="#F4A6CD"/>
      <circle cx="5" cy="-2" r="2.5" fill="#F4A6CD"/>
      <circle cx="-3" cy="3" r="2.5" fill="#F4A6CD"/>
      <circle cx="3" cy="3" r="2.5" fill="#F4A6CD"/>
    </g>
    <g transform="translate(360 230)">
      <circle cx="0" cy="0" r="3" fill="#FFCC00"/>
      <circle cx="-5" cy="-2" r="2.5" fill="#7EC8E3"/>
      <circle cx="5" cy="-2" r="2.5" fill="#7EC8E3"/>
      <circle cx="-3" cy="3" r="2.5" fill="#7EC8E3"/>
      <circle cx="3" cy="3" r="2.5" fill="#7EC8E3"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#FFCC00" stroke="#C99A00" stroke-width="1" opacity="0.8">
    <path d="M 200 80 L 202 84 L 206 84 L 203 87 L 204 91 L 200 88 L 196 91 L 197 87 L 194 84 L 198 84 Z"/>
    <circle cx="110" cy="140" r="2"/>
    <circle cx="290" cy="140" r="2"/>
  </g>

  <!-- ===== GIRL (left) ===== -->
  <g>
    <!-- Legs/feet (slightly stepping forward) -->
    <ellipse cx="100" cy="370" rx="14" ry="8" fill="#5B3A1F" stroke="#3D2817" stroke-width="2"/>
    <ellipse cx="135" cy="370" rx="14" ry="8" fill="#5B3A1F" stroke="#3D2817" stroke-width="2"/>
    <rect x="93" y="345" width="14" height="22" fill="#D4A373" stroke="#C76B9C" stroke-width="2"/>
    <rect x="128" y="345" width="14" height="22" fill="#D4A373" stroke="#C76B9C" stroke-width="2"/>

    <!-- Body (dress) -->
    <path d="M 85 285 Q 75 340 85 360 L 155 360 Q 165 340 155 285 Z" fill="#F4A6CD" stroke="#C76B9C" stroke-width="2.5"/>
    <path d="M 85 358 Q 95 365 105 358 Q 115 365 125 358 Q 135 365 145 358 Q 155 365 155 360" fill="none" stroke="#C76B9C" stroke-width="2"/>
    <path d="M 100 285 Q 120 293 140 285" fill="none" stroke="#C76B9C" stroke-width="2.5"/>
    <circle cx="120" cy="295" r="3.5" fill="#E63946" stroke="#A02029" stroke-width="1"/>

    <!-- Left arm down -->
    <ellipse cx="78" cy="310" rx="11" ry="22" fill="#D4A373" stroke="#C76B9C" stroke-width="2.5" transform="rotate(-8 78 310)"/>
    <circle cx="72" cy="335" r="10" fill="#D4A373" stroke="#C76B9C" stroke-width="2.5"/>

    <!-- Right arm extended toward baby's hand (HOLDING HANDS) -->
    <path d="M 155 300 Q 180 295 200 295" fill="none" stroke="#D4A373" stroke-width="18" stroke-linecap="round"/>
    <path d="M 155 300 Q 180 295 200 295" fill="none" stroke="#C76B9C" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Head (3/4 facing forward, tilted slightly right toward baby) -->
    <g transform="rotate(8 120 200)">
      <!-- Hair back -->
      <path d="M 65 215 Q 65 152 120 148 Q 175 152 175 215 Q 175 235 167 245 L 73 245 Q 65 235 65 215 Z" fill="#6B4226"/>
      <!-- Face -->
      <circle cx="120" cy="205" r="55" fill="#D4A373" stroke="#7A4A1F" stroke-width="2.5"/>
      <!-- Bangs -->
      <path d="M 70 183 Q 90 163 120 163 Q 150 163 170 183 Q 160 192 147 188 Q 133 184 120 188 Q 107 184 93 188 Q 80 192 70 183 Z" fill="#6B4226"/>

      <!-- Pigtails -->
      <g transform="translate(53 195) rotate(-12)">
        <ellipse cx="0" cy="15" rx="13" ry="22" fill="#6B4226" stroke="#4A2D1A" stroke-width="1.5"/>
        <ellipse cx="0" cy="-5" rx="9" ry="5" fill="#E63946" stroke="#A02029" stroke-width="1.5"/>
      </g>
      <g transform="translate(187 195) rotate(12)">
        <ellipse cx="0" cy="15" rx="13" ry="22" fill="#6B4226" stroke="#4A2D1A" stroke-width="1.5"/>
        <ellipse cx="0" cy="-5" rx="9" ry="5" fill="#E63946" stroke="#A02029" stroke-width="1.5"/>
      </g>

      <!-- Joyful face -->
      <path d="M 87 184 Q 97 180 107 186" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
      <path d="M 133 186 Q 143 180 153 184" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
      <!-- Open happy eyes (sparkles in them) -->
      <ellipse cx="98" cy="212" rx="8" ry="9" fill="white" stroke="#3D2817" stroke-width="2"/>
      <ellipse cx="142" cy="212" rx="8" ry="9" fill="white" stroke="#3D2817" stroke-width="2"/>
      <circle cx="100" cy="215" r="4.5" fill="#3D2817"/>
      <circle cx="144" cy="215" r="4.5" fill="#3D2817"/>
      <circle cx="102" cy="213" r="1.8" fill="white"/>
      <circle cx="146" cy="213" r="1.8" fill="white"/>
      <circle cx="98" cy="217" r="0.8" fill="white"/>
      <circle cx="142" cy="217" r="0.8" fill="white"/>
      <!-- Eyelashes -->
      <line x1="90" y1="206" x2="88" y2="203" stroke="#3D2817" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="106" y1="206" x2="108" y2="203" stroke="#3D2817" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="134" y1="206" x2="132" y2="203" stroke="#3D2817" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="150" y1="206" x2="152" y2="203" stroke="#3D2817" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Happy blush -->
      <ellipse cx="82" cy="230" rx="11" ry="7" fill="#FFB3B3" opacity="0.8"/>
      <ellipse cx="158" cy="230" rx="11" ry="7" fill="#FFB3B3" opacity="0.8"/>
      <!-- Big smile -->
      <path d="M 100 243 Q 120 258 140 243 Q 130 252 120 252 Q 110 252 100 243 Z" fill="#8B2C2C" stroke="#3D2817" stroke-width="2"/>
      <path d="M 105 246 L 135 246 L 132 251 L 108 251 Z" fill="white"/>
    </g>
  </g>

  <!-- ===== BABY BOY (right) ===== -->
  <g>
    <!-- Legs/feet -->
    <ellipse cx="265" cy="370" rx="13" ry="7" fill="#7EC8E3" stroke="#3A6FA8" stroke-width="2"/>
    <ellipse cx="300" cy="370" rx="13" ry="7" fill="#7EC8E3" stroke="#3A6FA8" stroke-width="2"/>
    <rect x="259" y="345" width="13" height="22" fill="#D4A373" stroke="#3A6FA8" stroke-width="2"/>
    <rect x="294" y="345" width="13" height="22" fill="#D4A373" stroke="#3A6FA8" stroke-width="2"/>

    <!-- Body (onesie) -->
    <path d="M 250 295 Q 243 345 250 360 L 320 360 Q 325 345 318 295 Z" fill="#7EC8E3" stroke="#3A6FA8" stroke-width="2.5"/>
    <line x1="285" y1="305" x2="285" y2="355" stroke="#3A6FA8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="285" cy="315" r="2.5" fill="#3A6FA8"/>
    <circle cx="285" cy="340" r="2.5" fill="#3A6FA8"/>

    <!-- Left arm reaching to hold girl's hand -->
    <path d="M 248 305 Q 225 295 200 295" fill="none" stroke="#D4A373" stroke-width="16" stroke-linecap="round"/>
    <path d="M 248 305 Q 225 295 200 295" fill="none" stroke="#3A6FA8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ===== CLASPED HANDS (center) ===== -->
    <ellipse cx="200" cy="295" rx="18" ry="13" fill="#D4A373" stroke="#7A4A1F" stroke-width="2.5"/>
    <!-- Little fingers visible -->
    <path d="M 192 290 Q 195 285 198 290" fill="none" stroke="#7A4A1F" stroke-width="1.5"/>
    <path d="M 200 288 Q 203 283 206 288" fill="none" stroke="#7A4A1F" stroke-width="1.5"/>
    <!-- Tiny heart above clasped hands -->
    <path d="M 200 278
             C 195 273 188 277 193 283
             C 196 286 200 290 200 290
             C 200 290 204 286 207 283
             C 212 277 205 273 200 278 Z"
          fill="#E63946" stroke="#A02029" stroke-width="1.5"/>

    <!-- Right arm down -->
    <ellipse cx="325" cy="315" rx="11" ry="20" fill="#D4A373" stroke="#3A6FA8" stroke-width="2.5" transform="rotate(10 325 315)"/>
    <circle cx="333" cy="335" r="10" fill="#D4A373" stroke="#3A6FA8" stroke-width="2.5"/>

    <!-- Head, tilted toward girl (left) -->
    <g transform="rotate(-10 285 215)">
      <circle cx="285" cy="215" r="58" fill="#D4A373" stroke="#7A4A1F" stroke-width="2.5"/>
      <!-- Baby hair -->
      <path d="M 275 162 Q 280 150 285 160 Q 288 153 292 162" fill="none" stroke="#6B4226" stroke-width="3" stroke-linecap="round"/>
      <path d="M 270 168 Q 277 158 282 168" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 290 170 Q 297 160 302 170" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Happy baby face -->
      <path d="M 258 195 Q 268 191 276 197" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
      <path d="M 294 197 Q 302 191 312 195" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
      <!-- Open sparkly eyes -->
      <ellipse cx="268" cy="215" rx="9" ry="10" fill="white" stroke="#3D2817" stroke-width="2"/>
      <ellipse cx="302" cy="215" rx="9" ry="10" fill="white" stroke="#3D2817" stroke-width="2"/>
      <circle cx="270" cy="218" r="5" fill="#3D2817"/>
      <circle cx="304" cy="218" r="5" fill="#3D2817"/>
      <circle cx="272" cy="215" r="1.8" fill="white"/>
      <circle cx="306" cy="215" r="1.8" fill="white"/>
      <circle cx="268" cy="220" r="1" fill="white"/>
      <circle cx="302" cy="220" r="1" fill="white"/>
      <!-- Happy cheeks -->
      <ellipse cx="251" cy="233" rx="11" ry="7" fill="#FFB3B3" opacity="0.8"/>
      <ellipse cx="320" cy="233" rx="11" ry="7" fill="#FFB3B3" opacity="0.8"/>
      <!-- Toothy grin (with gap continuity) -->
      <path d="M 268 245 Q 285 262 302 245 Q 295 254 285 254 Q 275 254 268 245 Z" fill="#8B2C2C" stroke="#3D2817" stroke-width="2"/>
      <rect x="288" y="247" width="4" height="6" fill="white"/>
      <rect x="278" y="247" width="4" height="3" fill="#3D1414" opacity="0.7"/>
    </g>
  </g>

  <!-- Number badge -->
  <circle cx="370" cy="30" r="22" fill="#1C1815"/>
  <text x="370" y="38" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFCC00" text-anchor="middle">9</text>
</svg>
