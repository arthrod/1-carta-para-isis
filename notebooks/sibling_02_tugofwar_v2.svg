<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#FFF8F0"/>
  <ellipse cx="200" cy="375" rx="160" ry="10" fill="#E8DDD0" opacity="0.6"/>

  <!-- Action lines around toy -->
  <g stroke="#FFCC00" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M 200 130 L 200 110"/>
    <path d="M 170 140 L 155 125"/>
    <path d="M 230 140 L 245 125"/>
    <path d="M 200 250 L 200 270"/>
  </g>

  <!-- ===== GIRL (left) leaning back, pulling ===== -->
  <g>
    <!-- Feet planted, leaning back -->
    <ellipse cx="70" cy="370" rx="16" ry="8" fill="#5B3A1F" stroke="#3D2817" stroke-width="2"/>
    <ellipse cx="100" cy="370" rx="16" ry="8" fill="#5B3A1F" stroke="#3D2817" stroke-width="2"/>
    <rect x="62" y="345" width="14" height="25" fill="#D4A373" stroke="#C76B9C" stroke-width="2"/>
    <rect x="92" y="345" width="14" height="25" fill="#D4A373" stroke="#C76B9C" stroke-width="2"/>

    <!-- Body (dress, tilted back) -->
    <path d="M 55 285 Q 45 340 55 360 L 135 360 Q 125 340 115 285 Z" fill="#F4A6CD" stroke="#C76B9C" stroke-width="2.5"/>
    <path d="M 55 358 Q 65 365 75 358 Q 85 365 95 358 Q 105 365 115 358 Q 125 365 135 360" fill="none" stroke="#C76B9C" stroke-width="2"/>
    <!-- Collar -->
    <path d="M 70 285 Q 85 295 100 285" fill="none" stroke="#C76B9C" stroke-width="2.5"/>

    <!-- Arms stretched forward toward toy -->
    <path d="M 100 295 Q 140 240 175 215" fill="none" stroke="#D4A373" stroke-width="22" stroke-linecap="round"/>
    <path d="M 100 295 Q 140 240 175 215" fill="none" stroke="#C76B9C" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hands grabbing toy -->
    <circle cx="180" cy="212" r="14" fill="#D4A373" stroke="#C76B9C" stroke-width="2.5"/>

    <!-- Head, tilted back from effort -->
    <g transform="translate(0 0) rotate(-8 95 200)">
      <!-- Hair back -->
      <path d="M 42 215 Q 42 152 100 148 Q 158 152 158 215 Q 158 240 148 248 L 52 248 Q 42 240 42 215 Z" fill="#6B4226"/>
      <!-- Face -->
      <circle cx="100" cy="200" r="55" fill="#D4A373" stroke="#7A4A1F" stroke-width="2.5"/>
      <!-- Bangs -->
      <path d="M 52 178 Q 70 158 100 158 Q 130 158 148 178 Q 138 185 125 182 Q 110 178 100 182 Q 90 178 75 182 Q 62 185 52 178 Z" fill="#6B4226"/>

      <!-- Pigtails -->
      <g transform="translate(30 190) rotate(-20)">
        <ellipse cx="0" cy="15" rx="14" ry="24" fill="#6B4226" stroke="#4A2D1A" stroke-width="1.5"/>
        <ellipse cx="0" cy="-5" rx="10" ry="5" fill="#E63946" stroke="#A02029" stroke-width="1.5"/>
      </g>
      <g transform="translate(170 190) rotate(20)">
        <ellipse cx="0" cy="15" rx="14" ry="24" fill="#6B4226" stroke="#4A2D1A" stroke-width="1.5"/>
        <ellipse cx="0" cy="-5" rx="10" ry="5" fill="#E63946" stroke="#A02029" stroke-width="1.5"/>
      </g>

      <!-- Determined angry face -->
      <!-- Eyebrows pulled down -->
      <path d="M 70 188 L 90 196" stroke="#3D2817" stroke-width="4" stroke-linecap="round"/>
      <path d="M 130 188 L 110 196" stroke="#3D2817" stroke-width="4" stroke-linecap="round"/>
      <!-- Squinted eyes -->
      <path d="M 72 208 Q 82 203 92 208" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
      <path d="M 108 208 Q 118 203 128 208" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
      <circle cx="82" cy="210" r="2.5" fill="#3D2817"/>
      <circle cx="118" cy="210" r="2.5" fill="#3D2817"/>
      <!-- Red cheeks -->
      <ellipse cx="65" cy="225" rx="9" ry="6" fill="#FF6B6B" opacity="0.65"/>
      <ellipse cx="135" cy="225" rx="9" ry="6" fill="#FF6B6B" opacity="0.65"/>
      <!-- Gritted teeth mouth -->
      <path d="M 85 238 L 115 238 L 113 246 L 87 246 Z" fill="white" stroke="#3D2817" stroke-width="2.5"/>
      <line x1="93" y1="238" x2="93" y2="246" stroke="#3D2817" stroke-width="1.5"/>
      <line x1="100" y1="238" x2="100" y2="246" stroke="#3D2817" stroke-width="1.5"/>
      <line x1="107" y1="238" x2="107" y2="246" stroke="#3D2817" stroke-width="1.5"/>
    </g>

    <!-- "MINE!" -->
    <text x="35" y="290" font-family="Comic Sans MS, cursive" font-size="18" font-weight="bold" fill="#C76B9C">MINE!</text>
  </g>

  <!-- ===== STUFFED BUNNY TOY (center, stretched) ===== -->
  <g>
    <!-- Body stretched -->
    <ellipse cx="200" cy="215" rx="28" ry="22" fill="#F5E6D3" stroke="#8B6F47" stroke-width="2.5"/>
    <!-- Head -->
    <circle cx="200" cy="190" r="20" fill="#F5E6D3" stroke="#8B6F47" stroke-width="2.5"/>
    <!-- Long ears -->
    <ellipse cx="190" cy="165" rx="6" ry="18" fill="#F5E6D3" stroke="#8B6F47" stroke-width="2"/>
    <ellipse cx="210" cy="165" rx="6" ry="18" fill="#F5E6D3" stroke="#8B6F47" stroke-width="2"/>
    <ellipse cx="190" cy="168" rx="3" ry="12" fill="#FFB6C1"/>
    <ellipse cx="210" cy="168" rx="3" ry="12" fill="#FFB6C1"/>

    <!-- Bunny face - distressed -->
    <circle cx="193" cy="188" r="2.5" fill="#3D2817"/>
    <circle cx="207" cy="188" r="2.5" fill="#3D2817"/>
    <!-- Worried mouth -->
    <path d="M 195 198 Q 200 194 205 198" fill="none" stroke="#3D2817" stroke-width="2" stroke-linecap="round"/>
    <!-- Pink nose -->
    <path d="M 200 193 L 197 196 L 203 196 Z" fill="#FF9BB5"/>

    <!-- Stitches showing strain -->
    <line x1="185" y1="215" x2="180" y2="215" stroke="#8B6F47" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="215" y1="215" x2="220" y2="215" stroke="#8B6F47" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Floating cotton fluff escaping -->
    <circle cx="175" cy="200" r="3" fill="white" stroke="#CCC" stroke-width="1"/>
    <circle cx="225" cy="205" r="2.5" fill="white" stroke="#CCC" stroke-width="1"/>
    <circle cx="170" cy="225" r="2" fill="white" stroke="#CCC" stroke-width="1"/>
  </g>

  <!-- ===== BABY BOY (right) sitting back, pulling ===== -->
  <g>
    <!-- Legs/feet spread out (sitting position) -->
    <ellipse cx="300" cy="370" rx="15" ry="8" fill="#7EC8E3" stroke="#3A6FA8" stroke-width="2"/>
    <ellipse cx="335" cy="370" rx="15" ry="8" fill="#7EC8E3" stroke="#3A6FA8" stroke-width="2"/>
    <rect x="293" y="345" width="14" height="25" fill="#D4A373" stroke="#3A6FA8" stroke-width="2"/>
    <rect x="328" y="345" width="14" height="25" fill="#3A6FA8" stroke="#3A6FA8" stroke-width="2"/>

    <!-- Body (onesie) -->
    <path d="M 275 290 Q 268 345 275 360 L 350 360 Q 350 345 340 290 Z" fill="#7EC8E3" stroke="#3A6FA8" stroke-width="2.5"/>
    <circle cx="310" cy="315" r="3" fill="#3A6FA8"/>
    <circle cx="310" cy="335" r="3" fill="#3A6FA8"/>

    <!-- Arms stretched toward toy -->
    <path d="M 285 295 Q 250 245 225 215" fill="none" stroke="#D4A373" stroke-width="22" stroke-linecap="round"/>
    <path d="M 285 295 Q 250 245 225 215" fill="none" stroke="#3A6FA8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hand grabbing toy -->
    <circle cx="220" cy="213" r="13" fill="#D4A373" stroke="#3A6FA8" stroke-width="2.5"/>

    <!-- Other arm braced back -->
    <ellipse cx="348" cy="305" rx="11" ry="18" fill="#D4A373" stroke="#3A6FA8" stroke-width="2.5" transform="rotate(15 348 305)"/>

    <!-- Head, tilted from effort -->
    <g transform="rotate(8 305 205)">
      <circle cx="305" cy="205" r="58" fill="#D4A373" stroke="#7A4A1F" stroke-width="2.5"/>
      <!-- Baby hair -->
      <path d="M 300 152 Q 305 140 310 150 Q 313 143 317 152" fill="none" stroke="#6B4226" stroke-width="3" stroke-linecap="round"/>
      <path d="M 295 158 Q 302 148 307 158" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 310 160 Q 317 150 322 160" fill="none" stroke="#6B4226" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Angry determined eyebrows -->
      <path d="M 278 192 L 296 200" stroke="#3D2817" stroke-width="4" stroke-linecap="round"/>
      <path d="M 332 192 L 314 200" stroke="#3D2817" stroke-width="4" stroke-linecap="round"/>
      <!-- Squinted eyes -->
      <path d="M 280 213 Q 290 208 300 213" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
      <path d="M 310 213 Q 320 208 330 213" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
      <circle cx="290" cy="215" r="2.5" fill="#3D2817"/>
      <circle cx="320" cy="215" r="2.5" fill="#3D2817"/>
      <!-- Red cheeks -->
      <ellipse cx="273" cy="232" rx="10" ry="7" fill="#FF6B6B" opacity="0.65"/>
      <ellipse cx="337" cy="232" rx="10" ry="7" fill="#FF6B6B" opacity="0.65"/>
      <!-- Open shouting mouth -->
      <ellipse cx="305" cy="245" rx="11" ry="10" fill="#8B2C2C"/>
      <ellipse cx="305" cy="248" rx="6" ry="4" fill="#3D1414"/>
      <!-- Two tiny baby teeth -->
      <rect x="301" y="237" width="3" height="5" fill="white"/>
      <rect x="306" y="237" width="3" height="5" fill="white"/>
    </g>

    <!-- "NO!!" -->
    <text x="335" y="290" font-family="Comic Sans MS, cursive" font-size="20" font-weight="bold" fill="#3A6FA8">NO!!</text>
  </g>

  <!-- Number badge -->
  <circle cx="370" cy="30" r="22" fill="#1C1815"/>
  <text x="370" y="38" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFCC00" text-anchor="middle">2</text>
</svg>
